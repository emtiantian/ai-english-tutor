# ── CosyVoice TTS 可选叠加部署 ──
#
# 用法（需 NVIDIA GPU；首次 up 自动构建 cosyvoice:local 镜像，约 5-10 分钟）：
#   docker compose -f docker-compose.yml -f docker-compose.cosyvoice.yml up -d
#
# 说明：
# - 主 docker-compose.yml 只包含 gateway / frontend / backend / whisper 核心服务
# - CosyVoice 强依赖 GPU，作为可选 TTS Provider 拆到此 override 文件
# - 镜像构建已与主部署解耦：cosyvoice:local 由本文件 build 块从 scripts/cosyvoice/Dockerfile
#   构建（官方未发布镜像，Dockerfile 内部 git clone 源码）。主部署 push:server 不再自动
#   构建 cosyvoice（避免其构建失败拖累主程序），请单独运行 `pnpm deploy:cosyvoice` 构建。
#   镜像已存在时，push:server / 开机自启的 `up -d` 会直接复用拉起；构建需代理
#   BUILD_PROXY（默认 http://127.0.0.1:7890），build.network: host 让容器内代理直达宿主机。
# - 首次启动时会从 modelscope 拉取 iic/CosyVoice2-0.5B 模型到 modelscope 缓存
# - 模型挂载随 AI_TUTOR_HOME（部署根）走，便于跨机/跨目录迁移并命中缓存：
#     <root>/data/modelscope-cache -> /root/.cache/modelscope（modelscope 下载缓存，
#       镜像未设 MODELSCOPE_CACHE，默认落在 root HOME 下；命中即跳过 ~11G 重下）
#     <root>/data/cosyvoice-models  -> pretrained_models（代码侧预置模型目录）
# - 自定义音色 spk2info 挂载（只读）：
#     <root>/data/cosyvoice-spk2info -> /opt/CosyVoice/spk2info
#       存放参考音频 (<spk_id>.wav) 与由 `pnpm build:cosyvoice-spk2info` 生成的
#       spk2info.pt；换机器部署时随 AI_TUTOR_HOME/data 一起迁移，无需重训。
#       server.py 经 wrapper（scripts/cosyvoice/server-wrapper.py）启动时自动扫描
#       本目录 *.pt 合并加载到 frontend.spk2info，无需手工注入 modelscope 缓存。
# - logging 限制单文件 50m × 5 份，避免长跑服务日志撑爆磁盘。
# - healthcheck 用 POST /inference_sft 探测 FastAPI 是否就绪；
#   模型加载约 90-120s，start_period 给到 120s。

services:
  cosyvoice:
    image: cosyvoice:local
    # 首次 up 镜像不存在时自动从 scripts/cosyvoice/Dockerfile 构建；
    # 代理随主 compose 一致走 build.network: host + build.args（手动 up）/ --build-arg（部署脚本）
    build:
      context: ./scripts/cosyvoice
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://127.0.0.1:7890}
        HTTPS_PROXY: ${BUILD_PROXY:-http://127.0.0.1:7890}
    ports:
      - '50000:50000'
    volumes:
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data/modelscope-cache:/root/.cache/modelscope
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data/cosyvoice-models:/opt/CosyVoice/CosyVoice/pretrained_models
      # 自定义音色持久化目录（只读）：参考音频 + spk2info.pt，换机器随 data/ 迁移
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data/cosyvoice-spk2info:/opt/CosyVoice/spk2info:ro
      # server.py 启动包装器（只读）：自动扫描上方 spk2info 目录，合并 *.pt 到 frontend.spk2info
      - ./scripts/cosyvoice/server-wrapper.py:/opt/cosyvoice-scripts/server-wrapper.py:ro
    command:
      - bash
      - -c
      - 'cd /opt/CosyVoice/CosyVoice && python /opt/cosyvoice-scripts/server-wrapper.py --port 50000 --model_dir iic/CosyVoice2-0.5B'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - tutor-net
    restart: unless-stopped
    # 日志大小限制：单文件 50MB、最多 5 份，总上限 250MB
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    # 健康探测：TCP 端口探测（不触发推理、不占 GPU 显存），仅判断 50000 端口已监听。
    # 模型在 server.py 模块顶层加载、uvicorn.run 在最后，端口监听 ≈ 模型就绪；
    # 即便过早 healthy，backend provider 的重试逻辑（5xx/超时自动重试）兜底。
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import socket,sys; s=socket.socket(); s.settimeout(5); sys.exit(0 if s.connect_ex((''localhost'',50000))==0 else 1)"'
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
