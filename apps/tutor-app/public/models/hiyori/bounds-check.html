<!DOCTYPE html>
<html>
<body>
<script type="module">
  const res = await fetch('/models/hiyori/hiyori.model3.json');
  const modelJson = await res.json();
  console.log('Canvas size ref:', modelJson); 
  
  const mocRes = await fetch('/models/hiyori/Hiyori.moc3');
  const mocBuf = await mocRes.arrayBuffer();
  
  // Need Live2D Core loaded
  await new Promise(r => {
    const check = () => {
      if (window.Live2DCubismCore) r();
      else setTimeout(check, 100);
    };
    check();
  });
  
  const core = window.Live2DCubismCore;
  const moc = core.createMoc(new Uint8Array(mocBuf));
  const model = core.createModel(moc);
  
  // Get bounds
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const drawableCount = model.drawableCounts[0];
  for (let i = 0; i < drawableCount; i++) {
    const vertices = model.drawableVertexPositions[i];
    for (let j = 0; j < vertices.length; j += 2) {
      minX = Math.min(minX, vertices[j]);
      maxX = Math.max(maxX, vertices[j]);
      minY = Math.min(minY, vertices[j+1]);
      maxY = Math.max(maxY, vertices[j+1]);
    }
  }
  console.log('Actual vertex bounds:');
  console.log('  X:', minX, '~', maxX, 'width:', maxX - minX);
  console.log('  Y:', minY, '~', maxY, 'height:', maxY - minY);
  console.log('Canvas ref:', model.canvasinfo[0], 'x', model.canvasinfo[1]);
  
  document.body.innerHTML = `
    <pre>
Canvas reference: ${model.canvasinfo[0]} x ${model.canvasinfo[1]}
Actual bounds:
  X: ${minX.toFixed(3)} ~ ${maxX.toFixed(3)} (width: ${(maxX-minX).toFixed(3)})
  Y: ${minY.toFixed(3)} ~ ${maxY.toFixed(3)} (height: ${(maxY-minY).toFixed(3)})
    </pre>
  `;
</script>
</body>
</html>
