# ── AI English Tutor - 共享 location / CORS 片段 ──
# 被 nginx.conf 的 HTTP server 和 ssl.conf.template 的 HTTPS server
# 同时 include，避免两处维护同一份 location / CORS 配置而漏改。
#
# 依赖外层 nginx.conf http 块定义的 map 变量：
#   $backend_target / $frontend_target / $cors_allow_origin

# ── CORS for all requests ──
add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
add_header 'Access-Control-Expose-Headers' 'Content-Type, Authorization' always;
add_header 'Access-Control-Max-Age' '86400' always;

# ── Preflight ──
if ($request_method = 'OPTIONS') {
    return 204;
}

# ── SSE endpoint (must be before generic /api/) ──
location /api/chat/stream {
    proxy_pass $backend_target;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # Disable buffering for SSE
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Long timeout for SSE connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ── API proxy ──
location /api/ {
    proxy_pass $backend_target;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Frontend proxy ──
location / {
    proxy_pass $frontend_target;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
