# ── AI English Tutor — Nginx Gateway ──
# Single entry point: handles CORS, reverse-proxies /api/* to backend
# and / to frontend. Serves both HTTP (80) and HTTPS (443, when TLS
# certs are mounted at /etc/nginx/certs/) simultaneously.
#
# Environment variables substituted at container startup by
# gateway/docker-entrypoint.sh:
#   BACKEND_URL   - Backend API URL (default: http://backend:3000)
#   FRONTEND_URL  - Frontend URL (default: http://frontend:80)
#   CORS_ORIGIN   - Allowed origins. Use * for all, or a single origin.
#   SERVER_NAME   - Virtual host (default: _, matches all). For HTTPS
#                   you typically want a real FQDN / IP.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker internal DNS (required for variable proxy_pass)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolve env vars via map so they can be used in proxy_pass
    map $host $backend_target {
        default "${BACKEND_URL}";
    }
    map $host $frontend_target {
        default "${FRONTEND_URL}";
    }
    map $host $cors_allow_origin {
        default "${CORS_ORIGIN}";
    }

    # ── HTTP (always on) ──
    server {
        listen 80;
        listen [::]:80;
        server_name ${SERVER_NAME};

        # ── CORS for all requests ──
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # ── Preflight ──
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── SSE endpoint (must be before generic /api/) ──
        location /api/chat/stream {
            proxy_pass $backend_target;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Long timeout for SSE connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── API proxy ──
        location /api/ {
            proxy_pass $backend_target;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Frontend proxy ──
        location / {
            proxy_pass $frontend_target;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS (only when docker-entrypoint.sh generates ssl.conf) ──
    # The 443 server block lives in gateway/ssl.conf.template and is
    # rendered to /etc/nginx/conf.d/ssl.conf by the entrypoint script
    # only if /etc/nginx/certs/{fullchain,privkey}.pem exist. Otherwise
    # the file is removed and HTTPS is silently disabled.
    include /etc/nginx/conf.d/*.conf;
}
