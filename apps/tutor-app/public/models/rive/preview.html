<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive 角色候选预览 · 挑选</title>
  <!-- Rive canvas 运行时（dev 预览用 CDN；正式集成用项目里的 @rive-app/canvas） -->
  <script src="https://unpkg.com/@rive-app/canvas@2.38.1"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background:#0f1115; color:#e6e6e6; font: 14px/1.5 -apple-system, system-ui, sans-serif; }
    header { padding: 16px 20px; border-bottom:1px solid #222; }
    header h1 { margin:0 0 4px; font-size:18px; }
    header p { margin:0; color:#9aa; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; padding:20px; }
    .card { background:#161a21; border:1px solid #232a35; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
    .card h2 { margin:0; padding:10px 14px; font-size:15px; background:#1c222c; display:flex; justify-content:space-between; align-items:center; }
    .card h2 .sz { color:#7d8aa0; font-weight:400; font-size:12px; }
    .stage { aspect-ratio: 1/1; background: radial-gradient(circle at 50% 35%, #232b38, #11151c); }
    .stage canvas { width:100%; height:100%; display:block; }
    .meta { padding:10px 14px; border-top:1px solid #232a35; }
    .meta .row { margin:2px 0; }
    .meta .k { color:#7d8aa0; }
    .inputs { padding:8px 14px 14px; border-top:1px solid #232a35; }
    .inputs:empty::after { content:"（无状态机输入）"; color:#667; }
    .inp { display:flex; align-items:center; gap:8px; margin:6px 0; }
    .inp label { flex:0 0 130px; font-family: ui-monospace, monospace; font-size:12px; color:#bcd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .inp .ty { flex:0 0 58px; font-size:11px; color:#7d8aa0; }
    .inp input[type=range]{ flex:1; }
    .inp button { background:#2b6cb0; color:#fff; border:0; border-radius:6px; padding:4px 10px; cursor:pointer; }
    .inp input[type=number]{ width:64px; background:#0f141b; color:#e6e6e6; border:1px solid #2a3340; border-radius:5px; padding:2px 6px; }
    .err { color:#f88; padding:10px 14px; font-size:12px; }
    code { background:#0f141b; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <header>
    <h1>Rive 角色候选预览</h1>
    <p>下面是从 Rive 官方示例仓库下载的候选角色。看动画 + 看每个文件暴露的 <b>状态机输入</b>（拖滑块/点按钮可手动驱动）。
       挑好后把对应 <code>.riv</code> 拷成 <code>/models/rive/tutor.riv</code>，并按其输入名调整 <code>rive-character.ts</code> 即可。</p>
  </header>
  <div class="grid" id="grid"></div>

  <script>
    const FILES = [
      { name:'avatars',       file:'candidates/avatars.riv',       note:'★ 你喜欢的头像风格：单个干净头像，带视线跟随 + 嘴型(开心/难过/闭嘴)' },
      { name:'avatar_demo',   file:'candidates/avatar_demo.riv',   note:'★ 可定制头像生成器：11种发型/多种眼睛/肤色配色，可配成女性look（带换装UI）' },
      { name:'marty',         file:'candidates/marty.riv',         note:'拟人头像角色' },
      { name:'marty_v2',      file:'candidates/marty_v2.riv',      note:'marty 升级版' },
      { name:'mascot',        file:'candidates/mascot.riv',        note:'吉祥物角色' },
      { name:'Bear',          file:'candidates/Bear.riv',          note:'小熊（亲和/儿童向）' },
      { name:'lip-sync_test', file:'candidates/lip-sync_test.riv', note:'口型同步演示（陪练核心）' },
    ];
    const { Rive, Layout, Fit, Alignment, StateMachineInputType } = rive;
    const TYPE = { [StateMachineInputType.Number]:'Number', [StateMachineInputType.Boolean]:'Boolean', [StateMachineInputType.Trigger]:'Trigger' };

    const grid = document.getElementById('grid');

    for (const f of FILES) {
      const card = document.createElement('div'); card.className='card';
      card.innerHTML = `
        <h2><span>${f.name}</span><span class="sz" data-sz>…</span></h2>
        <div class="stage"><canvas></canvas></div>
        <div class="meta">
          <div class="row"><span class="k">说明：</span>${f.note}</div>
          <div class="row"><span class="k">画板/状态机：</span><span data-sm>探测中…</span></div>
        </div>
        <div class="inputs" data-inputs></div>`;
      grid.appendChild(card);

      const canvas = card.querySelector('canvas');
      const szEl = card.querySelector('[data-sz]');
      const smEl = card.querySelector('[data-sm]');
      const inputsEl = card.querySelector('[data-inputs]');

      fetch(f.file).then(r=> szEl.textContent = r.ok ? Math.round(+r.headers.get('content-length')/1024)+' KB' : 'HTTP '+r.status).catch(()=>{});

      // pass 1: 探测状态机名
      const probe = new Rive({
        src: f.file, canvas: document.createElement('canvas'), autoplay:false,
        onLoad: () => {
          const sms = probe.stateMachineNames || [];
          const abs = probe.artboardNames || [];
          smEl.textContent = `${abs.join(', ') || '默认'}  ·  SM: ${sms.length? sms.join(', ') : '（无）'}`;
          probe.cleanup();
          mount(sms[0]);
        },
        onLoadError: (e)=>{ smEl.textContent=''; inputsEl.innerHTML = `<div class="err">加载失败：${e}</div>`; }
      });

      function mount(smName){
        const r = new Rive({
          src: f.file, canvas, autoplay:true,
          stateMachines: smName || undefined,
          layout: new Layout({ fit: Fit.Contain, alignment: Alignment.Center }),
          onLoad: () => {
            r.resizeDrawingSurfaceToCanvas();
            if (!smName) return;
            const inputs = r.stateMachineInputs(smName) || [];
            if (!inputs.length) return;
            for (const inp of inputs) {
              const ty = TYPE[inp.type] || '?';
              const row = document.createElement('div'); row.className='inp';
              const safe = inp.name.replace(/</g,'&lt;');
              if (inp.type === StateMachineInputType.Trigger) {
                row.innerHTML = `<label title="${safe}">${safe}</label><span class="ty">${ty}</span>`;
                const b=document.createElement('button'); b.textContent='fire'; b.onclick=()=>inp.fire(); row.appendChild(b);
              } else if (inp.type === StateMachineInputType.Boolean) {
                row.innerHTML = `<label title="${safe}">${safe}</label><span class="ty">${ty}</span>`;
                const c=document.createElement('input'); c.type='checkbox'; c.checked=!!inp.value; c.onchange=()=>inp.value=c.checked; row.appendChild(c);
              } else {
                row.innerHTML = `<label title="${safe}">${safe}</label><span class="ty">${ty}</span>`;
                const s=document.createElement('input'); s.type='range'; s.min=0; s.max=1; s.step=0.01; s.value=Number(inp.value)||0;
                const n=document.createElement('input'); n.type='number'; n.step=0.1; n.value=Number(inp.value)||0; n.style.flex='0 0 64px';
                s.oninput=()=>{ inp.value=+s.value; n.value=+s.value; };
                n.oninput=()=>{ inp.value=+n.value; if(+n.value>=0&&+n.value<=1) s.value=+n.value; };
                row.append(s,n);
              }
              inputsEl.appendChild(row);
            }
          }
        });
      }
    }
  </script>
</body>
</html>
