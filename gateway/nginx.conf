# ── AI English Tutor - Nginx Gateway ──
# Single entry point: reverse-proxies /api/* to backend
# and / to frontend. Serves both HTTP (80) and HTTPS (443, when TLS
# certs are mounted at /etc/nginx/certs/) simultaneously.
#
# Environment variables substituted at container startup by
# gateway/docker-entrypoint.sh:
#   BACKEND_URL   - Backend API URL (default: http://backend:3000)
#   FRONTEND_URL  - Frontend URL (default: http://frontend:80)
#   SERVER_NAME   - Virtual host (default: _, matches all). For HTTPS
#                   you typically want a real FQDN / IP.
#
# location / CORS 配置抽到 gateway/locations.conf，HTTP/HTTPS server 共用。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker internal DNS (required for variable proxy_pass)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolve env vars via map so they can be used in proxy_pass
    map $host $backend_target {
        default "${BACKEND_URL}";
    }
    map $host $frontend_target {
        default "${FRONTEND_URL}";
    }
    # ── HTTP (always on) ──
    server {
        listen 80;
        listen [::]:80;
        server_name ${SERVER_NAME};

        include /etc/nginx/locations.conf;
    }

    # ── HTTPS (only when docker-entrypoint.sh generates ssl.conf) ──
    # The 443 server block lives in gateway/ssl.conf.template and is
    # rendered to /etc/nginx/conf.d/ssl.conf by the entrypoint script
    # only if /etc/nginx/certs/{fullchain,privkey}.pem exist. Otherwise
    # the file is removed and HTTPS is silently disabled.
    include /etc/nginx/conf.d/*.conf;
}
