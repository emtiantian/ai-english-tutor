name: ai-english-tutor

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      cache_from:
        - ai-english-tutor-gateway:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_URL=http://backend:3000
      - FRONTEND_URL=http://frontend:80
      - CORS_ORIGIN=*
      - SERVER_NAME=${SERVER_NAME:-_}
    volumes:
      # TLS certs；缺失时 entrypoint 静默禁用 443，可安全挂载
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - tutor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/tutor-app/Dockerfile
      cache_from:
        - ai-english-tutor-frontend:latest
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
        - VITE_CHARACTER_PROVIDER=${VITE_CHARACTER_PROVIDER:-live2d}
        - VITE_LIVE2D_MODEL_ID=${VITE_LIVE2D_MODEL_ID:-}
        - VITE_LIVE2D_MAX_DPR=${VITE_LIVE2D_MAX_DPR:-}
        - VITE_RIVE_SRC=${VITE_RIVE_SRC:-}
        - VITE_RIVE_STATE_MACHINE=${VITE_RIVE_STATE_MACHINE:-}
    # 不暴露端口，通过 gateway 访问
    networks:
      - tutor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/tutor-server/Dockerfile
      cache_from:
        - ai-english-tutor-backend:latest
    # 所有运行时配置均来自 env_file；不在 environment 中硬编码，避免静默覆盖 .env。
    env_file:
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data/.env
    volumes:
      - ${AI_TUTOR_HOME:-~/.ai-english-tutor}/data:/app/data
    networks:
      - tutor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Whisper / CosyVoice 为可选叠加服务，不在主 compose：
  #   ASR=whisper:   docker compose -f docker-compose.yml -f docker-compose.whisper.yml up -d
  #   TTS=cosyvoice: docker compose -f docker-compose.yml -f docker-compose.cosyvoice.yml up -d

networks:
  tutor-net:
    driver: bridge
