server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # 静态资源已在镜像构建阶段生成 .gz；按 Accept-Encoding 直接发送预压缩文件。
    # 禁用动态 gzip，避免生产请求消耗 CPU；Vary 防止共享缓存混用压缩与原始响应。
    gzip_static on;
    gzip_vary on;
    gzip off;

    # 入口和 Service Worker 必须每次重新验证，否则发布后浏览器可能继续运行旧包。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # PWA 已移除，旧入口不得落到 SPA 的 index.html。
    location = /registerSW.js {
        return 404;
    }

    location = /manifest.webmanifest {
        return 404;
    }

    # 文件名带内容哈希，可以安全长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Live2D 引擎、模型、纹理和图标为固定资源，长期不修改。
    # 首次下载后缓存一年，避免后续访问再次发起网络请求。
    location ~ ^/(lib|models|icons)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
